<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- GitDom's icon: the startup logo's highway, squared up; the amber car is changing lane -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34275a" />
      <stop offset="1" stop-color="#17131f" />
    </linearGradient>
    <g id="car">
      <rect width="64" height="32" rx="10" />
      <rect x="9" y="7" width="9" height="18" rx="3" fill="rgba(0,0,0,0.3)" />
      <rect x="40" y="5" width="13" height="22" rx="4" fill="rgba(255,255,255,0.65)" />
    </g>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#tile)" />
  <rect x="4.5" y="4.5" width="247" height="247" rx="55.5" fill="none" stroke="rgba(255,255,255,0.12)" />
  <g stroke="rgba(255,255,255,0.28)" stroke-width="5" stroke-dasharray="22 14" stroke-linecap="round">
    <line x1="14" x2="242" y1="80" y2="80" />
    <line x1="14" x2="242" y1="128" y2="128" />
    <line x1="14" x2="242" y1="176" y2="176" />
  </g>
  <use href="#car" x="20" y="40" fill="#b48cff" />
  <use href="#car" x="20" y="184" fill="#7aa2ff" />
  <use href="#car" x="96" y="112" fill="#f5b454" transform="rotate(14 128 128)" />
  <use href="#car" x="172" y="88" fill="#5ee6c4" />
  <use href="#car" x="172" y="184" fill="#ff7eb6" />
</svg>
