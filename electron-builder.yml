# The Windows builds use the Electron already in node_modules (the package.json scripts pass
# electronDist): no download, which the corporate network makes unreliable. macOS and Linux are
# built on GitHub, for processors other than the runner's too, so Electron is downloaded there.
appId: com.gitdom.app
productName: GitDom
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{docs/*,bench/*,LICENSE}'
# Chromium's own texts (context menus, dialogs) in English and Italian only: the other ~50 languages
# are megabytes the portable exe unpacks at every start
electronLanguages:
  - en-US
  - it
asarUnpack:
  - resources/**
  # The terminal's native module and the console helpers it starts must be real files
  - node_modules/@lydell/node-pty*/**
win:
  executableName: gitdom
# A single self-contained exe: it unpacks itself to a temporary folder at each start, nothing to install
portable:
  artifactName: ${productName}-${version}-portable.${ext}
# The installer: for the current user only, in %LOCALAPPDATA%\Programs\GitDom, so no administrator
# rights; it starts at once afterwards, without unpacking anything. The updater runs it silently.
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: true
  perMachine: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
# A disk image per processor, signed ad hoc (Apple Silicon runs nothing unsigned) but not by a
# registered developer: macOS asks to confirm the first opening
mac:
  target: dmg
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# The AppImage runs anywhere without installing; the deb installs on Debian and Ubuntu
linux:
  target:
    - AppImage
    - deb
  executableName: gitdom
  maintainer: dtropeano <dtropeano@hotmail.it>
  category: Development
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
