# Builds GitDom's self-contained Windows exe.
# Pushing a tag like v0.1.0 publishes it in a GitHub Release; running it by hand from the
# Actions tab only attaches it to the run, as a downloadable artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the portable exe
        run: npm run build:portable -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: GitDom-portable
          path: dist/*-portable.exe
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the version's section of CHANGELOG.md, or GitHub's list of changes when it
        # has none. A rerun replaces the executable and the notes instead of failing.
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / {
              if (found) exit
              split(substr($0, 4), words, " ")
              gsub(/[][]|^v/, "", words[1])
              found = words[1] == version
              next
            }
            found
          ' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*-portable.exe --clobber
            if [ "${notes[0]}" = --notes-file ]; then gh release edit "$GITHUB_REF_NAME" --notes-file notes.md; fi
          else
            gh release create "$GITHUB_REF_NAME" dist/*-portable.exe --title "GitDom $GITHUB_REF_NAME" "${notes[@]}"
          fi
