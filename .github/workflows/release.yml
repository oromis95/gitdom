# Builds GitDom's self-contained Windows exe.
# Pushing a tag like v0.1.0 publishes it in a GitHub Release; running it by hand from the
# Actions tab only attaches it to the run, as a downloadable artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the portable exe
        run: npm run build:portable -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: GitDom-portable
          path: dist/*-portable.exe
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*-portable.exe --title "GitDom $GITHUB_REF_NAME" --generate-notes
