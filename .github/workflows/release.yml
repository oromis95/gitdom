# Builds GitDom after the CI checks pass: for Windows the installer and the self-contained exe, for
# macOS a disk image per processor, for Linux an AppImage and a deb. Pushing a tag like v0.1.0
# publishes them in a GitHub Release, each with its SHA-256 checksum that the app's updater verifies;
# running it by hand from the Actions tab only attaches them to the run, as downloadable artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the installer and the portable exe
        run: npm run build:release -- --publish never

      # "<hash>  <file name>", like sha256sum: the updater refuses a download that doesn't match
      - name: Checksum
        shell: bash
        run: |
          cd dist
          for file in *-portable.exe *-setup.exe; do sha256sum "$file" > "$file.sha256"; done
          cat *.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: GitDom-windows
          path: |
            dist/*-portable.exe
            dist/*-portable.exe.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          if-no-files-found: error

  linux:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the AppImage and the deb
        run: npm run build:linux -- --publish never

      - name: Checksum
        run: |
          cd dist
          for file in *.AppImage *.deb; do sha256sum "$file" > "$file.sha256"; done
          cat *.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: GitDom-linux
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  mac:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm installs the terminal's native module for the runner's processor only: the Intel build
      # needs its own as well
      - name: Terminal module for Intel Macs
        run: |
          version=$(node -p "require('@lydell/node-pty/package.json').version")
          npm install --no-save --force "@lydell/node-pty-darwin-x64@$version"

      - name: Build the disk images
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac -- --publish never

      - name: Checksum
        run: |
          cd dist
          for file in *.dmg; do shasum -a 256 "$file" > "$file.sha256"; done
          cat *.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: GitDom-mac
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  # Windows is required, as its copies update themselves from the release; a macOS or Linux build
  # that failed leaves only its own files out, to be added by rerunning its job
  publish:
    needs: [windows, linux, mac]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      # The notes are the version's section of CHANGELOG.md, or GitHub's list of changes when it
      # has none. A rerun replaces the files and the notes instead of failing.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / {
              if (found) exit
              split(substr($0, 4), words, " ")
              gsub(/[][]|^v/, "", words[1])
              found = words[1] == version
              next
            }
            found
          ' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          files=(dist/*)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            if [ "${notes[0]}" = --notes-file ]; then gh release edit "$GITHUB_REF_NAME" --notes-file notes.md; fi
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "GitDom $GITHUB_REF_NAME" "${notes[@]}"
          fi
